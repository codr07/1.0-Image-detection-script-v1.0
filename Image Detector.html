<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Image Detector</title>
    <style>
      :root {
        --bg: #f6f5f1;
        --card: #fff;
        --tx: #1d1c1a;
        --mu: #6b6860;
        --ac: #2f6f4f;
        --ac2: #e5f0e9;
        --bd: #dedbd2;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #171815;
          --card: #222320;
          --tx: #ecebe6;
          --mu: #a09d93;
          --ac: #6fc095;
          --ac2: #243229;
          --bd: #37382f;
        }
      }
      :root[data-theme="dark"] {
        --bg: #171815;
        --card: #222320;
        --tx: #ecebe6;
        --mu: #a09d93;
        --ac: #6fc095;
        --ac2: #243229;
        --bd: #37382f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--mu);
        margin: 0 0 20px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
      }
      #drop {
        border: 2px dashed var(--bd);
        border-radius: 14px;
        padding: 32px 16px;
        text-align: center;
        cursor: pointer;
        color: var(--mu);
      }
      #drop.over {
        border-color: var(--ac);
        background: var(--ac2);
      }
      #preview {
        max-width: 100%;
        max-height: 360px;
        border-radius: 10px;
        display: none;
        margin: 0 auto;
      }
      button {
        background: var(--ac);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 11px 20px;
        font-size: 16px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      
      @media (prefers-color-scheme:dark) {:root[data-theme="dark"] button,
        button {
          color: #10130f;
        }
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      #status {
        color: var(--mu);
      }
      h2 {
        font-size: 17px;
        margin: 0 0 10px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        background: var(--ac2);
        color: var(--tx);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 14px;
      }
      .obj {
        border-top: 1px solid var(--bd);
        padding: 12px 0;
      }
      .obj:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .oh {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
      }
      .on {
        font-weight: 600;
      }
      .cnt {
        background: var(--ac);
        color: #fff;
        border-radius: 8px;
        padding: 1px 10px;
        font-weight: 600;
        font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        .cnt {
          color: #10130f;
        }
      }
      .od {
        color: var(--mu);
        font-size: 14px;
        margin: 4px 0 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px;
      }
      .kv b {
        display: block;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--mu);
      }
      .err {
        color: #b3392b;
      }
      .note {
        color: var(--mu);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>🔍 Image Detector</h1>
      <p class="sub">
        Upload any photo and get a detailed breakdown: objects, counts, types,
        colors, setting and more.
      </p>

      <div class="card">
        <div id="drop">Drop an image here or tap to choose one</div>
        <input id="file" type="file" accept="image/*" hidden />
        <img id="preview" alt="Selected image preview" />
        <div class="row">
          <button id="go" disabled>Analyze image</button>
          <span id="status"></span>
        </div>
      </div>

      <div id="out"></div>
      <p class="note">
        Counts are visual estimates. For crowded scenes, expect “about” numbers.
      </p>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let blob = null;

      function load(f) {
        if (!f || !f.type.startsWith("image/")) return;
        const img = new Image();
        img.onload = () => {
          const m = 1280,
            s = Math.min(1, m / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * s);
          c.height = Math.round(img.height * s);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(
            (b) => {
              blob = b;
              $("preview").src = URL.createObjectURL(b);
              $("preview").style.display = "block";
              $("go").disabled = false;
              $("status").textContent = "";
              $("out").innerHTML = "";
            },
            "image/jpeg",
            0.85,
          );
        };
        img.src = URL.createObjectURL(f);
      }
      $("drop").onclick = () => $("file").click();
      $("file").onchange = (e) => load(e.target.files[0]);
      $("drop").ondragover = (e) => {
        e.preventDefault();
        $("drop").classList.add("over");
      };
      $("drop").ondragleave = () => $("drop").classList.remove("over");
      $("drop").ondrop = (e) => {
        e.preventDefault();
        $("drop").classList.remove("over");
        load(e.dataTransfer.files[0]);
      };

      const PROMPT = `You are an expert image analyst. Examine the attached image carefully and return ONLY valid JSON (no markdown, no backticks) with this shape:
{"summary":"2-3 sentence description of the whole scene",
"scene_type":"e.g. forest, street, kitchen",
"setting":"location/environment, time of day, weather, season if visible",
"objects":[{"name":"category e.g. Trees","count":12,"count_is_estimate":false,"types":["specific kinds/species/models if identifiable"],"details":"colors, size, position, condition, activity"}],
"people":{"count":0,"details":"age groups, clothing, actions, expressions"},
"animals":[{"name":"","count":0,"details":""}],
"dominant_colors":["..."],
"lighting_mood":"lighting and atmosphere",
"text_in_image":["any readable text or signs"],
"notable_details":["other interesting features"]}
Rules: list every distinct kind of object separately (e.g. pine trees vs oak trees as types under Trees, each animal species as its own entry). Count carefully; if too many to count exactly, give your best estimate and set count_is_estimate true. Use empty arrays or 0 when nothing applies. Be specific, never vague.`;

      function el(t, c, x) {
        const e = document.createElement(t);
        if (c) e.className = c;
        if (x != null) e.textContent = x;
        return e;
      }
      function card(title) {
        const d = el("div", "card");
        d.appendChild(el("h2", "", title));
        $("out").appendChild(d);
        return d;
      }
      function chips(d, arr) {
        const w = el("div", "chips");
        arr.forEach((a) => w.appendChild(el("span", "chip", a)));
        d.appendChild(w);
      }

      function render(r) {
        const out = $("out");
        out.innerHTML = "";
        let d = card(
          (r.scene_type || "Scene").replace(/^./, (m) => m.toUpperCase()),
        );
        d.appendChild(el("p", "", r.summary || ""));
        const g = el("div", "grid");
        [
          ["Setting", r.setting],
          ["Lighting & mood", r.lighting_mood],
        ].forEach(([k, v]) => {
          if (v) {
            const x = el("div", "kv");
            x.appendChild(el("b", "", k));
            x.appendChild(el("span", "", v));
            g.appendChild(x);
          }
        });
        d.appendChild(g);

        const objs = r.objects || [];
        if (objs.length) {
          d = card("Objects detected (" + objs.length + " categories)");
          objs.forEach((o) => {
            const x = el("div", "obj"),
              h = el("div", "oh");
            h.appendChild(el("span", "on", o.name));
            h.appendChild(
              el("span", "cnt", (o.count_is_estimate ? "~" : "") + o.count),
            );
            x.appendChild(h);
            if (o.types && o.types.length) {
              const t = el("div", "chips");
              t.style.marginTop = "6px";
              o.types.forEach((a) => t.appendChild(el("span", "chip", a)));
              x.appendChild(t);
            }
            if (o.details) x.appendChild(el("p", "od", o.details));
            d.appendChild(x);
          });
        }
        if (r.people && r.people.count > 0) {
          d = card("People (" + r.people.count + ")");
          d.appendChild(el("p", "", r.people.details || ""));
        }
        if (r.animals && r.animals.length) {
          d = card("Animals");
          r.animals.forEach((a) => {
            const x = el("div", "obj"),
              h = el("div", "oh");
            h.appendChild(el("span", "on", a.name));
            h.appendChild(el("span", "cnt", a.count));
            x.appendChild(h);
            if (a.details) x.appendChild(el("p", "od", a.details));
            d.appendChild(x);
          });
        }
        if (r.dominant_colors && r.dominant_colors.length) {
          d = card("Dominant colors");
          chips(d, r.dominant_colors);
        }
        if (r.text_in_image && r.text_in_image.length) {
          d = card("Text in image");
          chips(d, r.text_in_image);
        }
        if (r.notable_details && r.notable_details.length) {
          d = card("Other details");
          const ul = el("ul");
          ul.style.margin = "0";
          ul.style.paddingLeft = "20px";
          r.notable_details.forEach((n) => ul.appendChild(el("li", "", n)));
          d.appendChild(ul);
        }
      }

      $("go").onclick = async () => {
        if (!blob) return;
        $("go").disabled = true;
        $("status").className = "";
        $("status").textContent = "Analyzing…";
        $("out").innerHTML = "";
        try {
          const sample = await claude.use("sample");
          if (!sample)
            throw {
              message:
                "The analysis feature isn’t available in this view. Open the page from claude.ai and allow access.",
            };
          const res = await sample(PROMPT, {
            images: [blob],
            modelTier: "default",
            cache: false,
          });
          const m = res.text.match(/\{[\s\S]*\}/);
          if (!m)
            throw { message: "Couldn’t read the result. Please try again." };
          render(JSON.parse(m[0]));
          $("status").textContent = "Done";
        } catch (e) {
          $("status").className = "err";
          $("status").textContent =
            e.code === "not_granted"
              ? "Permission was declined."
              : e.message || "Something went wrong.";
        }
        $("go").disabled = false;
      };
    </script>
  </body>
</html>
